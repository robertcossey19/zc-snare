name: extract
on:
  push:
    paths: ['jobs/**']
  workflow_dispatch:
    inputs:
      ids:
        description: 'job ids (space separated); blank = every jobs/<id>/input.* without a report'
        required: false
        default: ''
      intake_run:
        description: 'intake run id whose artifact holds the songs (blank for jobs/ committed by hand)'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
  issues: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: github.event.inputs.intake_run != ''
        with: { name: 'intake-${{ github.event.inputs.intake_run }}', path: work/intake, run-id: '${{ github.event.inputs.intake_run }}', github-token: '${{ github.token }}' }
      - name: Which jobs
        id: which
        run: |
          set -e
          if [ -n "${{ github.event.inputs.ids }}" ]; then ids="${{ github.event.inputs.ids }}"; else
            ids=""; for d in jobs/*/; do [ -d "$d" ] || continue; id=$(basename "$d"); ls "$d"input.* >/dev/null 2>&1 || continue; [ -f "packs/$id/report.json" ] && continue; ids="$ids $id"; done; fi
          for id in $ids; do if [ -d "work/intake/$id" ]; then mkdir -p "jobs/$id"; mv work/intake/$id/input.* "jobs/$id/"; cp "work/intake/$id/meta.json" "jobs/$id/meta.json"; fi; ls -la "jobs/$id" || true; done
          echo "ids=$ids" >> "$GITHUB_OUTPUT"; echo "jobs to run: [$ids]"
      - uses: actions/setup-python@v5
        if: steps.which.outputs.ids != ''
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: pipeline/requirements.txt }
      - name: Restore models
        if: steps.which.outputs.ids != ''
        uses: actions/cache@v4
        with:
          path: |
            work/ds/drumsep.ckpt
            work/ds/msst
            ~/.cache/huggingface
          key: models-v1-d2a4aa53-f0b52773
      - name: Install
        if: steps.which.outputs.ids != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install -q --upgrade pip
          python -m pip install -q -r pipeline/requirements.txt
          python -c "import torch,demucs,numpy,scipy;print('torch',torch.__version__,'numpy',numpy.__version__,'scipy',scipy.__version__)"
          nproc; free -g | head -2
      - name: Run
        if: steps.which.outputs.ids != ''
        env: { ZC_WORK: '${{ github.workspace }}/work' }
        run: |
          export OMP_NUM_THREADS=$(nproc) MKL_NUM_THREADS=$(nproc)
          for id in ${{ steps.which.outputs.ids }}; do echo "::group::job $id"; python pipeline/run_job.py "$id" || true; echo "::endgroup::"; done
      - name: Publish results
        if: steps.which.outputs.ids != '' && always()
        run: |
          git config user.name "zc-snare[bot]"; git config user.email "zc-snare@users.noreply.github.com"
          # input songs are never committed: they live in the intake artifact only (packs/ and queue/ are the only published dirs)
          for id in ${{ steps.which.outputs.ids }}; do git add -f "packs/$id" || true; git rm -q --cached --ignore-unmatch "queue/$id.json" 2>/dev/null; rm -f "queue/$id.json"; git rm -r -q --cached --ignore-unmatch "jobs/$id" 2>/dev/null; [ -f "packs/$id/report.json" ] && rm -rf "jobs/$id"; done
          git rm -r -q --cached --ignore-unmatch jobs 2>/dev/null; for d in packs queue; do [ -d "$d" ] && git add -A "$d"; done; true
          git commit -q -m "packs: ${{ steps.which.outputs.ids }} [skip ci]" || { echo "nothing to commit"; exit 0; }
          # the library index is derived from packs/, so it is never part of the rebased commit: rebuild it AFTER every rebase and amend (no index conflicts between parallel runs)
          ok=0; for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && { git rebase -q origin/main || { git rebase --abort; git checkout -q --theirs -- library/index.json 2>/dev/null; false; }; } || { echo "rebase retry $i"; sleep $((i*5)); continue; }
            git checkout -q origin/main -- library/index.json 2>/dev/null || true; python3 pipeline/index_packs.py; git add library/index.json; git commit -q --amend --no-edit
            git push -q origin HEAD:main && { ok=1; break; } || { echo "push retry $i"; sleep $((i*5)); }
          done
          [ $ok = 1 ] || { echo "::error::could not publish results after 8 attempts"; exit 1; }
      - name: Keep the pack as a run artifact too (safety net if the publish step cannot push)
        if: steps.which.outputs.ids != '' && always()
        uses: actions/upload-artifact@v4
        with: { name: 'packs-${{ github.run_id }}', path: 'packs/', retention-days: 7, if-no-files-found: ignore }
      - name: Tell the page
        if: steps.which.outputs.ids != '' && always()
        env: { ZC_NTFY_DONE: 'zc-snare-done-3b0fd4cb77640a88e253c855' }
        run: |
          sha=$(git rev-parse HEAD); for id in ${{ steps.which.outputs.ids }}; do python3 pipeline/notify.py "$id" auto "$sha"; done
      - name: Mail the pack (Gmail SMTP if ZC_SMTP_PASS is set, else FormSubmit, else a GitHub issue that GitHub e-mails to the owner)
        if: steps.which.outputs.ids != '' && always()
        env: { ZC_EMAIL: '${{ secrets.ZC_EMAIL }}', ZC_SMTP_PASS: '${{ secrets.ZC_SMTP_PASS }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          sha=$(git rev-parse HEAD); for id in ${{ steps.which.outputs.ids }}; do python3 pipeline/mail.py "$id" "$sha" || true; done
      - name: Delete the song artifact
        if: github.event.inputs.intake_run != '' && always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # other extract runs from the same intake batch may still need the songs: only delete when none is queued or running besides this one
          others=$(gh run list -R "$GITHUB_REPOSITORY" -w extract --json databaseId,status --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status == "queued" or .status == "in_progress" or .status == "waiting")] | length')
          if [ "${others:-0}" != "0" ]; then echo "$others other extract run(s) active - leaving the artifact (3-day retention)"; exit 0; fi
          for a in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.intake_run }}/artifacts" --jq '.artifacts[].id'); do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$a" && echo "deleted artifact $a"; done
