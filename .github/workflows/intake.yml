name: intake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull new jobs from the mailbox
        id: pull
        env: { ZC_NTFY_TOPIC: 'zc-snare-jobs-00a30119bd60e56e2593776a', ZC_NTFY_DONE: 'zc-snare-done-3b0fd4cb77640a88e253c855', ZC_WORK: '${{ github.workspace }}/work' }
        run: python3 pipeline/intake.py
      - uses: actions/upload-artifact@v4
        if: steps.pull.outputs.ids != ''
        with: { name: 'intake-${{ github.run_id }}', path: work/intake/, retention-days: 3, if-no-files-found: error, compression-level: 0 }
      - name: Claim (queue markers, fail reports)
        if: always()
        run: |
          git config user.name "zc-snare[bot]"; git config user.email "zc-snare@users.noreply.github.com"
          git add -A queue packs 2>/dev/null || true
          git commit -q -m "intake: ${{ steps.pull.outputs.ids }} [skip ci]" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || { echo retry $i; sleep $((i*7)); }; done
      - name: Start extract
        if: steps.pull.outputs.ids != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run extract -R "$GITHUB_REPOSITORY" -f ids="${{ steps.pull.outputs.ids }}" -f intake_run="${{ github.run_id }}"
